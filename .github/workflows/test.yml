name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test
      # tsc --noEmit tek başına Next.js'in kendi ürettiği .next/types
      # (LayoutProps vb.) olmadan çalışamıyor -- next build zaten kendi
      # type-check adımını içerdiğinden ayrı bir tsc adımına gerek yok.
      - run: npm run build
